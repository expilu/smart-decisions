name: Release

# Two modes, decided by changesets/action:
#  - pending changesets on main -> opens/updates the "Version Packages" PR
#    (bumps package.json, rewrites CHANGELOG.md, syncs src/version.ts)
#  - no pending changesets (a Version Packages PR was just merged)
#    -> node ./scripts/release.mjs: builds, publishes to npm with provenance
#    (OIDC trusted publishing, no stored token), tags vX.Y.Z and creates the
#    GitHub release from the CHANGELOG.md section — idempotently, so retries
#    and stranded announcements heal on the next run.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tag + GitHub release + Version Packages PR
  pull-requests: write # Version Packages PR
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # npm >= 11.5 is required for OIDC trusted publishing.
      - run: npm i -g npm@11

      - run: npm ci

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Single command: the action whitespace-splits this input and spawns
          # it as args (no shell), so chaining belongs in the package script.
          version: npm run changeset:version
          publish: node ./scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
